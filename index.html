<style>
/* VOICE everyday: herramienta de bolsillo para la mesa
   IDEA la mesa de póker misma: tocas un asiento y una situación, y su rango se enciende en la matriz 13x13
   PICTURE mesa ovalada de fieltro con 8 asientos + matriz de manos que se ilumina
   COLOUR fondo noche #0b1411, fieltro #0f5a3c, rojo subir, oro 3-bet, violeta 4-bet, azul pagar
   TYPE Barlow Condensed (fichas, letras de mesa) + Inter

:root{color-scheme:dark;--bg:#0b1411;--ink:#eef3ef;--mute:#9db1a7;--panel:#121d19;--line:#2d3c36;--felt:#0f5a3c;--felt2:#0a4430;--rail:#3a2416;--cell:#18231f;--cellink:#5f746a;--raise:#e5484d;--three:#f2b84b;--four:#a77bff;--call:#4aa3ff}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 28px;padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font:700 32px/1.05 'Barlow Condensed',sans-serif;letter-spacing:-.01em;margin:0}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--mute);font:600 14px Inter,sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:36px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.main{display:grid;gap:16px}
@media(min-width:880px){.main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}.left{position:sticky;top:12px}}
.table{position:relative;aspect-ratio:1.7;max-width:520px;margin:0 auto;width:100%}
.felt{position:absolute;inset:12% 10%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#147049,var(--felt) 55%,var(--felt2));box-shadow:0 0 0 9px var(--rail),0 0 0 11px #57382a,inset 0 0 30px #0006}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;border:1px dashed #ffffff40;background:#0000;color:#e8f5ee;border-radius:14px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer;min-height:40px}
.center b{display:block;font:700 18px 'Barlow Condensed',sans-serif}
.center[aria-pressed=true]{background:#ffffff1f;border-style:solid}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(46px,13%,66px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:#16211d;color:var(--ink);font:700 clamp(13px,3.3vw,18px)/1 'Barlow Condensed',sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,background .15s}
.seat[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translate(-50%,-50%) scale(1.1)}
.dealer{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font:700 11px Inter,sans-serif;display:grid;place-items:center;transform:translate(-50%,-50%)}
.sits{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sits button,.vars button,.focus button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:7px 13px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:40px}
.sits button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;color:var(--mute);font-size:13px}
.vars button{min-height:34px;padding:5px 12px;font-size:13px;color:var(--mute)}
.vars button[aria-pressed=true]{background:#ffffff1a;color:var(--ink);border-color:#ffffff55}
.tip{background:var(--panel);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gridhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.qpos{font:700 22px 'Barlow Condensed',sans-serif}
.qpos span{color:var(--mute);font:500 14px Inter,sans-serif;display:block}

.card .s{align-self:flex-end;font-size:30px}
.answers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.answers button{min-width:96px;min-height:52px;border-radius:12px;border:0;font:700 19px 'Barlow Condensed',sans-serif;cursor:pointer;color:#fff;padding:0 14px}
.answers button:active{transform:translateY(1px)}
.b-fold{background:#33413b}.b-raise{background:var(--raise)}.b-three{background:var(--three);color:#2a1d00!important}.b-four{background:var(--four)}.b-call{background:var(--call)}
.fb{min-height:44px;font-size:15px}
.fb.ok b{color:#5fd58a}.fb.bad b{color:#ff7a7e}
.score{display:flex;gap:18px;color:var(--mute);font-size:13px}
.score b{display:block;color:var(--ink);font:700 24px 'Barlow Condensed',sans-serif}
.focus{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.focus button{min-height:34px;padding:5px 11px;font-size:13px;color:var(--mute)}
.focus button[aria-pressed=true]{background:#ffffff1a;color:var(--ink);border-color:#ffffff55}
.types{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;padding:5px 10px;font:600 13px Inter,sans-serif;cursor:pointer;min-height:32px}
.types button[aria-pressed=true]{background:var(--felt);color:#fff;border-color:var(--felt)}
.foot{color:var(--mute);font-size:13px;margin-top:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    s.push(['Pagar 3-bet',v]);

function sits6(p){

  '9':{label:'Mesa de 9',POS:['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'],open:G.open,sits:sits9,
       ANG:{BTN:58,SB:100,BB:145,UTG:195,'UTG+1':240,LJ:290,HJ:335,CO:15},
       HEAT:{UTG:'#7d0f2e','UTG+1':'#a3123a',LJ:'#c8263f',HJ:'#e5484d',CO:'#f0834a',BTN:'#f2b84b',SB:'#8fb573'},
       src:''},
  '6':{label:'Mesa de 6',POS:POS6,open:P6.open,sits:sits6,
       ANG:{BTN:60,SB:120,BB:180,UTG:240,MP:300,CO:0},
       HEAT:{UTG:'#a3123a',MP:'#e5484d',CO:'#f0834a',BTN:'#f2b84b',SB:'#8fb573'},
       src:'Fuente: PokerStrategy.com, Big Stack Strategy, rangos preflop 6-max (lecciones 2253 a 2258), basados en 1,5 millones de manos de NL200. MP = HJ. 3-bet ~8 bb contra 3 bb.'}
};
const A={raise:{l:'Subir',c:'var(--raise)'},three:{l:'3-bet',c:'var(--three)',dark:1},four:{l:'4-bet',c:'var(--four)'},call:{l:'Pagar',c:'var(--call)'},limp:{l:'Limp',c:'var(--call)'}};
const ri=c=>R.indexOf(c);
const name=(i,j)=>i===j?R[i]+R[j]:i<j?R[i]+R[j]+'s':R[j]+R[i]+'o';
const combos=h=>h.length===2?6:h[2]==='s'?4:12;
const CACHE={};
function expand(str){
  if(CACHE[str])return CACHE[str];
  const out=new Set(),add=(a,b,t)=>{if(a===b){out.add(R[a]+R[a]);return}const hi=Math.min(a,b),lo=Math.max(a,b);if(t!=='o')out.add(R[hi]+R[lo]+'s');if(t!=='s')out.add(R[hi]+R[lo]+'o')};
  for(let t of str.split(',')){
    t=t.trim();let m;if(!t)continue;
    if(m=t.match(/^(.)[shdc](.)[shdc]$/)){const s=t[1]===t[3];add(ri(t[0]),ri(t[2]),t[0]===t[2]?'':s?'s':'o');continue}
    if(m=t.match(/^(.)\1-(.)\2$/)){const a=ri(m[1]),b=ri(m[2]);for(let k=Math.min(a,b);k<=Math.max(a,b);k++)add(k,k);continue}
    if(m=t.match(/^(.)\1(\+)?$/)){const k=ri(m[1]);if(m[2])for(let x=0;x<=k;x++)add(x,x);else add(k,k);continue}
    if(m=t.match(/^(.)(.)([so]?)-(.)(.)([so]?)$/)){
      const h1=ri(m[1]),k1=ri(m[2]),h2=ri(m[4]),k2=ri(m[5]);
      if(h1===h2){for(let k=Math.min(k1,k2);k<=Math.max(k1,k2);k++)add(h1,k,m[3])}
      else{const g=k1-h1;for(let h=Math.min(h1,h2);h<=Math.max(h1,h2);h++)add(h,h+g,m[3])}
      continue}
    if(m=t.match(/^(.)(.)([so]?)(\+)?$/)){
      const h=ri(m[1]),k=ri(m[2]);
      if(!m[4])add(h,k,m[3]);
      else if(k-h===1&&h>0){for(let x=h;x>=0;x--)add(x,x+1,m[3])} // conectores: 65s+ = 65s,76s,...
      else for(let x=h+1;x<=k;x++)add(h,x,m[3]);
    }
  }
  return CACHE[str]=out;
}
const ORDER=['four','three','raise','call','limp'];
const acts=(tab,h)=>ORDER.filter(k=>tab.layers[k]&&expand(tab.layers[k]).has(h));
const $=id=>document.getElementById(id);
let ty='9',T=TYPES[ty],st={pos:'BTN',sit:0,v:0,all:false,sel:null},q=null;
function load(){st={pos:'BTN',sit:0,v:0,all:false,sel:null};try{const s=JSON.parse(localStorage.getItem('rangos_'+ty)||'{}');if(T.POS.includes(s.pos))Object.assign(st,{pos:s.pos,sit:s.sit|0,v:s.v|0})}catch(e){}}
try{const t=localStorage.getItem('rangosTipo');if(TYPES[t]){ty=t;T=TYPES[t]}}catch(e){}
load();
const OPENPOS=()=>T.POS.filter(p=>T.open[p]);
const earliest=h=>OPENPOS().find(p=>expand(T.open[p]).has(h));
function cur(){const s=T.sits(st.pos);if(st.sit>=s.length)st.sit=0;const vs=s[st.sit][1];if(st.v>=vs.length)st.v=0;return vs[st.v]}
function save(){try{localStorage.setItem('rangos_'+ty,JSON.stringify({pos:st.pos,sit:st.sit,v:st.v}));localStorage.setItem('rangosTipo',ty)}catch(e){}}

const table=$('table');
function seats(){
  table.querySelectorAll('.seat,.dealer').forEach(e=>e.remove());
  for(const p of T.POS){
    const a=T.ANG[p]*Math.PI/180,b=document.createElement('button');
    b.className='seat';b.dataset.p=p;b.textContent=p;
    b.style.left=(50+43*Math.cos(a))+'%';b.style.top=(50+41*Math.sin(a))+'%';
    b.onclick=()=>{if(q&&!q.done)return;const prev=T.sits(st.pos)[st.sit][0];st.pos=p;st.all=false;st.sel=null;
      const s=T.sits(p),k=s.findIndex(x=>x[0]===prev);st.sit=k<0?0:k;st.v=0;save();render()};
    table.appendChild(b);
    if(p==='BTN'){const d=document.createElement('div');d.className='dealer';d.textContent='D';d.style.left=(50+31*Math.cos(a))+'%';d.style.top=(50+27*Math.sin(a))+'%';table.appendChild(d)}
  }
}
$('center').onclick=()=>{st.all=!st.all;render()};
$('sits').onclick=e=>{const k=e.target.dataset.k;if(k==null||(q&&!q.done))return;st.sit=+k;st.v=0;st.all=false;save();render()};
$('vars').onclick=e=>{const k=e.target.dataset.k;if(k==null||(q&&!q.done))return;st.v=+k;st.all=false;save();render()};
$('types').innerHTML=Object.keys(TYPES).map(k=>`<button data-t="${k}">${TYPES[k].label}</button>`).join('');
$('types').onclick=e=>{const t=e.target.dataset.t;if(!t||t===ty)return;ty=t;T=TYPES[t];load();save();seats();buildFocus();if(!$('vQuiz').hidden)next();else render()};

const grid=$('grid'),cells=[];
for(let i=0;i<13;i++)for(let j=0;j<13;j++){
  const h=name(i,j),b=document.createElement('button');b.className='c'+(i===j?' pair':'');b.textContent=h;b.dataset.h=h;
  b.onclick=()=>{if(q&&!q.done)return;st.sel=st.sel===h?null:h;render()};grid.appendChild(b);cells.push(b);
}
const pc=v=>(v/13.26).toFixed(1).replace('.',',')+' %';
const say=a=>a.length?a.map(k=>A[k].l.toLowerCase()).join(' o ')+(a.length>1?' (según el combo)':''):'fold';

function render(){
  const tab=cur(),s=T.sits(st.pos);
  $('types').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===ty));
  $('src').textContent=T.src;
  document.querySelectorAll('.seat').forEach(x=>x.setAttribute('aria-pressed',!st.all&&x.dataset.p===st.pos));
  $('center').setAttribute('aria-pressed',st.all);
  $('sits').innerHTML=s.map((x,k)=>`<button data-k="${k}" aria-pressed="${!st.all&&k===st.sit}">${x[0]}</button>`).join('');
  const vs=s[st.sit][1];
  $('vars').hidden=st.all||vs.length<2;
  $('vars').innerHTML=vs.map((x,k)=>`<button data-k="${k}" aria-pressed="${k===st.v}">${x.v}</button>`).join('');
  let n=0,mixed=false;
  for(const c of cells){
    const h=c.dataset.h;let bg='',dark=false;
    if(st.all){const e=earliest(h);if(e){bg=T.HEAT[e];n+=combos(h)}}
    else{const a=acts(tab,h);if(a.length){n+=combos(h);dark=a.length===1&&!!A[a[0]].dark;
      bg=a.length===1?A[a[0]].c:`linear-gradient(135deg,${A[a[0]].c} 50%,${A[a[1]].c} 50%)`;if(a.length>1)mixed=true}}
    c.style.background=bg;c.classList.toggle('on',!!bg);c.classList.toggle('dark',dark);c.classList.toggle('sel',st.sel===h);
  }
  if(st.all){
    $('gTitle').textContent='Desde dónde se abre cada mano';
    $('pct').innerHTML=pc(n)+'<span> se abre en algún asiento</span>';
    $('legend').innerHTML=OPENPOS().map(p=>`<span><i style="background:${T.HEAT[p]}"></i>${p}</span>`).join('');
    $('tip').innerHTML='<strong>Lectura rápida:</strong> lo más oscuro se abre desde UTG; el amarillo solo desde el botón.';
  }else{
    $('gTitle').textContent=tab.t;
    $('pct').innerHTML=pc(n)+'<span> de las manos</span>';
    $('legend').innerHTML=Object.keys(tab.layers).map(k=>`<span><i style="background:${A[k].c}"></i>${A[k].l}</span>`).join('')+(mixed?'<span><i style="background:linear-gradient(135deg,var(--three) 50%,var(--call) 50%)"></i>Según el combo</span>':'')+'<span><i style="background:var(--cell)"></i>Fold</span>';
    $('tip').innerHTML=`<strong>${st.pos}.</strong> ${tab.tip}`+(mixed?' Las celdas partidas se juegan de las dos formas según el combo: por ejemplo, un combo de AA se paga y los otros cinco se 3-betean.':'');
  }
  const h=st.sel;
  if(!h)$('info').textContent='Toca una mano para ver qué hacer con ella.';
  else{
    const op=OPENPOS().filter(p=>expand(T.open[p]).has(h));
    let x=`<b>${h}</b>`+(op.length?`Se abre desde ${op.length===OPENPOS().length?'todos los asientos':op.join(', ')}.`:'No se abre desde ningún asiento.');
    if(!st.all)x+=` En esta tabla: ${say(acts(tab,h))}.`;
    $('info').innerHTML=x;
  }
}

// práctica
let score={ok:0,tot:0,streak:0,best:0},focus='Todas';
try{const s=JSON.parse(localStorage.getItem('rangosQ9')||'null');if(s)score=Object.assign(score,s,{streak:0})}catch(e){}
function buildFocus(){focus='Todas';$('focus').innerHTML=['Todas',...T.POS].map(f=>`<button data-f="${f}" aria-pressed="${f===focus}">${f}</button>`).join('')}
$('focus').onclick=e=>{const f=e.target.dataset.f;if(!f)return;focus=f;$('focus').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));next()};
function scen(){const out=[];for(const p of T.POS)T.sits(p).forEach((x,si)=>x[1].forEach((t,vi)=>{if(x[0]!=='4-bet / 5-bet'||vi===0)out.push({pos:p,sit:si,v:vi})}));return out}
const SU=['♠','♥','♦','♣'],ALL=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)ALL.push(name(i,j));
function pickHand(tab){
  if(Math.random()<.3)return ALL[Math.floor(Math.random()*169)];
  const key=h=>acts(tab,h).join();
  const edge=ALL.filter((h,k)=>{const i=Math.floor(k/13),j=k%13,a=key(h);
    return[[0,1],[1,0],[0,-1],[-1,0]].some(([di,dj])=>{const x=i+di,y=j+dj;return x>=0&&y>=0&&x<13&&y<13&&key(ALL[x*13+y])!==a})});
  return edge[Math.floor(Math.random()*edge.length)];
}
function next(){
  const pool=scen().filter(s=>focus==='Todas'||s.pos===focus),sc=pool[Math.floor(Math.random()*pool.length)];
  Object.assign(st,{pos:sc.pos,sit:sc.sit,v:sc.v,all:false,sel:null});
  const tab=cur(),h=pickHand(tab);q=null;render();q={tab,h,done:false};
  $('qpos').innerHTML=sc.pos+' · '+T.sits(sc.pos)[sc.sit][0]+`<span>${tab.q}</span>`;
  const s1=Math.floor(Math.random()*4),s2=h[2]==='s'?s1:(s1+1+Math.floor(Math.random()*3))%4;
  const card=(r,s)=>`<div class="card${s===1||s===2?' red':''}"><span>${r==='T'?'10':r}</span><span class="s">${SU[s]}</span></div>`;
  $('cards').innerHTML=card(h[0],s1)+card(h[1],s2);
  $('answers').innerHTML=['fold',...Object.keys(tab.layers).reverse()].map(o=>`<button class="b-${o==='limp'?'call':o}" data-a="${o}">${o==='fold'?'Fold':A[o].l}</button>`).join('');
  $('fb').className='fb';$('fb').textContent='¿Qué haces?';
  for(const c of cells)c.style.opacity='.12';
}
$('answers').onclick=e=>{
  const a=e.target.dataset.a;if(!a||!q||q.done)return;q.done=true;
  const right=acts(q.tab,q.h),ok=right.length?right.includes(a):a==='fold';
  score.tot++;if(ok){score.ok++;score.streak++;score.best=Math.max(score.best,score.streak)}else score.streak=0;
  try{localStorage.setItem('rangosQ9',JSON.stringify(score))}catch(e){}
  $('fb').className='fb '+(ok?'ok':'bad');
  const r=say(right);
  $('fb').innerHTML=(ok?'<b>Correcto.</b> ':`<b>No: ${r[0].toUpperCase()+r.slice(1)}.</b> `)+`${q.h} en ${q.tab.t}.`;
  for(const c of cells)c.style.opacity='';st.sel=q.h;render();paint();
  setTimeout(()=>{if(q&&q.done&&!$('vQuiz').hidden)next()},ok?1100:2800);
};
function paint(){$('sOk').textContent=score.ok;$('sTot').textContent=score.tot;$('sStreak').textContent=score.streak;$('sBest').textContent=score.best}
function tab(quiz){
  $('tRangos').setAttribute('aria-pressed',!quiz);$('tQuiz').setAttribute('aria-pressed',quiz);
  $('vRangos').hidden=quiz;$('vQuiz').hidden=!quiz;
  if(quiz){$('vQuiz').prepend($('grid'));$('grid').style.marginBottom='14px';paint();next()}
  else{$('info').before($('grid'));$('grid').style.marginBottom='';for(const c of cells)c.style.opacity='';q=null;render()}
}
$('tRangos').onclick=()=>tab(false);$('tQuiz').onclick=()=>tab(true);
seats();buildFocus();render();
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body></html>
